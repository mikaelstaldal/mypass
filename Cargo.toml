[package]
name = "mypass"
version = "0.9.0"
edition = "2021"
description = "MyPass command line password manager"
license = "Apache-2.0"
default-run = "mypass"

[dependencies]
serde = { version = "~1.0.228", features = ["derive"] }
serde_json = "~1.0.150"
thiserror = "~2.0.18"
rand = "~0.10.1"
rand_chacha = "~0.10.0"
scrypt = { version = "~0.12.0", default-features = false }
aes = "~0.9.1"
ctr = "~0.10.1"
hmac = "~0.13.0"
sha2 = "~0.11.0"
zeroize = { version = "~1.8.2", features = ["derive"] }
psl = "~2.1.135"
idna = "~1.1.0"

# bin dependencies
anyhow = "~1.0.102"
clap = { version = "~4.6.1", features = ["derive"] }
clippers = "~0.1.2"
dirs = "~6.0.0"
rpassword = "7.5.4"
ratatui = { version = "~0.30.2", default-features = false, features = ["crossterm"] }
crossterm = "~0.29.0"

[[bin]]
name = "mypass"
path = "src/main.rs"

[[bin]]
name = "mypass-browser-host"
path = "src/bin/mypass-browser-host/main.rs"

[target.'cfg(unix)'.dependencies]
libc = "~0.2.180"

[dev-dependencies]
assert_cmd = "~2.2.2"
assert_fs = "~1.1.4"
predicates = "~3.1.4"
tempfile = "~3"
